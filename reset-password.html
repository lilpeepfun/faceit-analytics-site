
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Восстановление пароля — FACEIT Analytics</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #121318;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 30px;
      background: #242630;
      border: 1px solid #393b46;
      border-radius: 14px;
    }

    h1 {
      margin: 0 0 10px;
      color: #ff6633;
      font-size: 25px;
    }

    p {
      color: #b9bbc6;
      line-height: 1.5;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 20px 0 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #494b58;
      border-radius: 8px;
      background: #171820;
      color: white;
      font-size: 15px;
    }

    input:focus {
      outline: 2px solid #ff6633;
      border-color: transparent;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #ff6633;
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      margin-top: 18px;
      overflow-wrap: anywhere;
    }

    .success { color: #66d9a3; }
    .error { color: #ff8585; }

    a { color: #ff885e; }
  </style>
</head>

<body>
  <main class="card">
    <h1>FACEIT Analytics</h1>
    <p>Восстановление доступа к аккаунту</p>

    <form id="reset-form" hidden>
      <label for="password">Новый пароль</label>
      <input
        id="password"
        type="password"
        minlength="8"
        autocomplete="new-password"
        required
      >

      <label for="confirm-password">
        Повтори новый пароль
      </label>
      <input
        id="confirm-password"
        type="password"
        minlength="8"
        autocomplete="new-password"
        required
      >

      <button id="save-button" type="submit">
        Сохранить новый пароль
      </button>
    </form>

    <p id="status" role="status">
      Проверяем ссылку восстановления...
    </p>

    <p>
      <a href="./index.html">На главную</a>
    </p>
  </main>

  <script type="module">
    import {
      createClient
    } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL =
      "https://mawwcaqpewbhuiuvnmmb.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_TInNxrKsGGI88EhZiSdr9A_f1Ox-lfY";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY,
      {
        auth: {
          detectSessionInUrl: false,
          persistSession: false,
          autoRefreshToken: false
        }
      }
    );

    const form = document.getElementById("reset-form");
    const status = document.getElementById("status");
    const saveButton = document.getElementById("save-button");

    function showStatus(message, type = "") {
      status.textContent = message;
      status.className = type;
    }

    function clearSensitiveUrl() {
      history.replaceState(
        {},
        document.title,
        location.pathname
      );
    }

    async function initializeRecovery() {
      try {
        const query = new URLSearchParams(location.search);
        const hash = new URLSearchParams(
          location.hash.replace(/^#/, "")
        );

        const errorDescription =
          query.get("error_description") ||
          hash.get("error_description");

        if (errorDescription) {
          clearSensitiveUrl();
          showStatus(
            "Ссылка недействительна: " + errorDescription,
            "error"
          );
          return;
        }

        const tokenHash = query.get("token_hash");
        const type = query.get("type");
        const code = query.get("code");

        let error = null;

        if (tokenHash && type === "recovery") {
          const result = await supabase.auth.verifyOtp({
            token_hash: tokenHash,
            type: "recovery"
          });
          error = result.error;

        } else if (code) {
          const result =
            await supabase.auth.exchangeCodeForSession(code);
          error = result.error;

        } else if (
          hash.get("type") === "recovery" &&
          hash.get("access_token") &&
          hash.get("refresh_token")
        ) {
          const result = await supabase.auth.setSession({
            access_token: hash.get("access_token"),
            refresh_token: hash.get("refresh_token")
          });
          error = result.error;

        } else {
          showStatus(
            "Ссылка восстановления отсутствует или имеет неверный формат.",
            "error"
          );
          return;
        }

        clearSensitiveUrl();

        if (error) {
          showStatus(
            "Не удалось подтвердить ссылку: " + error.message,
            "error"
          );
          return;
        }

        const { data, error: userError } =
          await supabase.auth.getUser();

        if (userError || !data.user) {
          showStatus(
            "Не удалось проверить аккаунт. Запроси новую ссылку.",
            "error"
          );
          return;
        }

        form.hidden = false;
        showStatus(
          "Ссылка подтверждена. Введи новый пароль."
        );

      } catch (error) {
        clearSensitiveUrl();
        showStatus(
          "Ошибка проверки ссылки. Попробуй запросить новую.",
          "error"
        );
        console.error("Recovery initialization failed:", error);
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirm-password").value;

      if (password !== confirmPassword) {
        showStatus("Пароли не совпадают.", "error");
        return;
      }

      if (password.length < 8) {
        showStatus(
          "Пароль должен содержать минимум 8 символов.",
          "error"
        );
        return;
      }

      saveButton.disabled = true;
      showStatus("Сохраняем новый пароль...");

      try {
        const { error } = await supabase.auth.updateUser({
          password
        });

        if (error) {
          throw error;
        }

        await supabase.auth.signOut({
          scope: "local"
        });

        form.hidden = true;

        showStatus(
          "Пароль успешно изменён! Теперь можно войти в аккаунт с новым паролем.",
          "success"
        );

      } catch (error) {
        showStatus(
          "Не удалось изменить пароль: " + error.message,
          "error"
        );
      } finally {
        saveButton.disabled = false;
      }
    });

    initializeRecovery();
  </script>
</body>
</html>
